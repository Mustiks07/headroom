 <rect x="542" y="166" width="405" height="36" rx="18" fill="#DFFF38"/>
 <text x="745" y="190" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#10141F">Real changes → reviewed updates</text>
</svg>
